<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cards 2</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <main>
    <section>
      <div class="card blue">
        <h2>City at Dawn</h2>
        <p>Soft light, sharp lines.</p>
        <img src="/images/street.jpg" alt="Morning street">
      </div>
      <div class="card purple">
        <h2>Night Pulse</h2>
        <p>Neon glow in motion.</p>
        <img src="/images/street-night.jpg" alt="Night street scene">
      </div>
      <div class="card green">
        <h2>Concrete Rise</h2>
        <p>Towers in the haze.</p>
        <img src="/images/buildings.jpg" alt="City buildings">
      </div>
    </section>
  </main>
</body>
</html>
